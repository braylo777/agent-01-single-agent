<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Single Agent</title>
<style>body{font-family:system-ui;max-width:640px;margin:40px auto;padding:0 16px;background:#0b1730;color:#eef}input,button{font-size:16px;padding:10px}input{width:70%}pre{background:#13234a;padding:12px;white-space:pre-wrap}</style></head>
<body><h1>Single Agent (ReAct)</h1><p>Ask anything. Try: "What is 17*23 + 4?"</p>
<form id=f><input id=q placeholder="Your question"><button>Ask</button></form><h3>Answer</h3><pre id=a></pre><h3>Trace</h3><pre id=t></pre>
<script>f.onsubmit=async e=>{e.preventDefault();a.textContent="thinking…";t.textContent="";const r=await fetch("/api/ask",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({question:q.value})});const j=await r.json();a.textContent=j.answer||j.error;t.textContent=JSON.stringify(j.trace,null,2)}</script></body></html>
